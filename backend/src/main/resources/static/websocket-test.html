<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test</title>
</head>
<body>

<h2>WebSocket Chat Test</h2>

<button onclick="connect()">Connect</button>
<button onclick="sendMessage()">Send Message</button>

<pre id="output"></pre>

<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>

<script>

    let client;

    function log(message) {
        document.getElementById("output").textContent += message + "\n";
    }

    function connect() {

        client = new StompJs.Client({
            brokerURL: "wss://localhost:8443/ws"
        });

        client.onConnect = function () {

            log("Connected!");

            client.subscribe("/topic/chat", function (message) {

                log("Received: " + message.body);

            });

        };

        client.onStompError = function (frame) {

            log("STOMP Error: " + frame.headers["message"]);

        };

        client.onWebSocketError = function () {

            log("WebSocket connection error");

        };

        client.activate();
    }

    function sendMessage() {

        if (!client || !client.connected) {
            log("Not connected!");
            return;
        }

        client.publish({
            destination: "/app/chat",
            body: JSON.stringify({
                conversationId: 1,
                senderId: 1,
                messageText: "Hello from WebSocket"
            })
        });

        log("Message sent");

    }

</script>

</body>
</html>
